arch: "vit_b16_dynamic_parallel_lora_incremental" 
name: "rine_incremental"

model:
  # _target_ is not needed here as the trainer instantiates the model using these params
  name: vit_base_patch16_224 # Base ViT model name from timm
  pretrained: True
  # Set num_classes based on your task (e.g., 1 for binary classification with BCEWithLogitsLoss)
  num_classes: 1
  num_loras: 3     
  max_rank_potential: 8 
  rank_dropout_p: 0.1   # Rank dropout probability during training
  freeze_base: True     # Freeze base ViT and head

train:
  # Pipeline now points to the new trainer class
  pipeline:
    _target_: engine.incremental_lora_trainer.IncrementalLoRATrainer
  # factor: 0.2 # Removed, seems specific to RINEModel? Keep if needed by trainer.
  gpu_ids: [0] # Example: Use GPU 0. Adjust as needed ['0', '1']
  train_epochs: 5 # Example: Epochs per incremental stage
  check_val_every_n_epoch: 1
  seed: 1995
  # --- Dynamic LoRA Control Parameters ---
  initial_active_rank: 1        # Start each new stage with rank 1
  rank_increase_interval: 200   # Increase rank every 200 global steps
  rank_increment_amount: 1      # Increment rank by 1 each time
  # --- Optimizer Configuration (passed to hydra.utils.instantiate inside trainer) ---
  optimizer:
    _target_: torch.optim.AdamW # Changed to AdamW as it's common
    # _partial_: True # Removed, instantiation happens in trainer
    lr: 1e-4 # Example learning rate for LoRA params
    weight_decay: 0.01 # Example weight decay
    betas: [0.9, 0.999]
  # --- Scheduler Configuration (passed to hydra.utils.instantiate inside trainer) ---
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    # _partial_: True # Removed
    T_max: ${train.train_epochs} # T_max per stage
    eta_min: 1e-6 # Example minimum LR for cosine annealing
    interval: epoch # Specify when the scheduler steps (epoch or step)
    frequency: 1    # How often the scheduler steps per interval
    # monitor: val_loss # Needed only for schedulers like ReduceLROnPlateau
  # --- Checkpoint Configuration ---
  checkpoint_monitor: 'val_ap' # Metric to monitor (must be logged in validation_epoch_end)
  checkpoint_mode: 'max'     # 'max' or 'min' depending on the metric
  # --- Optional: Trainer specific arguments ---
  # trainer:
  #   precision: "16-mixed"
  #   num_sanity_val_steps: 0
  #   # Add other L.Trainer arguments here if needed

datasets:
  # Assuming the same base path and structure
  base_path: "/data/yabin/DF-arrow-data" # CHANGE THIS PATH if necessary
  train:
    source: # Define your incremental stages here
      - _target_: data.arrow_datasets.ArrowDatasets # Use explicit target path
        data_root: '${datasets.base_path}/ForenSynths'
        sub_sets: [ "car" ]
        split: 'train_binary'
      - _target_: data.arrow_datasets.ArrowDatasets
        data_root: '${datasets.base_path}/ForenSynths'
        sub_sets: [ "chair" ]
        split: 'train_binary'
      - _target_: data.arrow_datasets.ArrowDatasets
        data_root: '${datasets.base_path}/ForenSynths'
        sub_sets: [ "horse"]
        split: 'train_binary'
      - _target_: data.arrow_datasets.ArrowDatasets
        data_root: '${datasets.base_path}/ForenSynths'
        sub_sets: [ "cat" ]
        split: 'train_binary'
      # Add more stages as needed
    split_ratio: 0.95 # For train/val split within each stage's data
    batch_size: 64 # Adjusted batch size, modify based on GPU memory
    loader_workers: 16 # Adjusted workers, modify based on system
    trsf: # Training transforms - Keep or modify as needed
      - _target_: data.augmentations.DataAugment # Use explicit target path
        blur_prob: 0.1
        blur_sig: [ 0.0, 3.0 ]
        jpg_prob: 0.1
        jpg_method: [ 'cv2', 'pil' ]
        jpg_qual: [ 30, 100 ]
      - _target_: torchvision.transforms.RandomResizedCrop # Often used with ViT
        size: 224
        scale: (0.8, 1.0) # Example scale
      # - _target_: torchvision.transforms.RandomCrop # Original crop
      #   size: 224
      - _target_: torchvision.transforms.RandomHorizontalFlip
        p: 0.5
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        # Use standard ImageNet / CLIP means and stds for ViT
        mean: [ 0.485, 0.456, 0.406 ] # Or CLIP: [ 0.48145466, 0.4578275, 0.40821073 ]
        std: [ 0.229, 0.224, 0.225 ] # Or CLIP: [ 0.26862954, 0.26130258, 0.27577711 ]

  test:
    source: # Define your test sets
    - _target_: data.arrow_datasets.ArrowDatasets
      data_root: '${datasets.base_path}/ForenSynths'
      sub_sets: [ "biggan", "deepfake", "gaugan", "progan"  ]
      split: 'test'
      benchmark_name: 'ForenSynths' # Name used for logging results

    - _target_: data.arrow_datasets.ArrowDatasets
      data_root: '${datasets.base_path}/synthwildx'
      sub_sets: ['dalle3', 'firefly', 'midjourney_v5']
      split: 'test'
      benchmark_name: 'Synthwildx'
    # Add other test sets as needed

    batch_size: 128 # Can often be larger for testing
    loader_workers: 16 # Adjusted workers
    trsf: # Testing transforms - Usually simpler than training
      # - _target_: data.augmentations.RandomCompress # Keep if needed
      #   method: "JPEG"
      #   qf: [70, 100]
      - _target_: torchvision.transforms.Resize
        size: 256 # Resize before center crop
        interpolation: 3 # BICUBIC
      - _target_: torchvision.transforms.CenterCrop
        size: 224
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        # Use same normalization as training
        mean: [ 0.485, 0.456, 0.406 ] # Or CLIP: [ 0.48145466, 0.4578275, 0.40821073 ]
        std: [ 0.229, 0.224, 0.225 ] # Or CLIP: [ 0.26862954, 0.26130258, 0.27577711 ]