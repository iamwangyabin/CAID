seed: 0
device: auto
output_dir: outputs/caidbench

logging:
  backend: swanlab
  project: CAIDBench
  mode: cloud

scenario:
  data:
    backend: aid_arrow
    image_column: image
    remote:
      platform: modelscope
      repo_ids:
        huggingface: nebula/CDDB.arrow
        modelscope: yabinnng/CDDB.arrow
      local_dir: data/datasets/CDDB.arrow
      path_in_repo: .
      max_workers: 16
  protocol: protocols/examples/cddb_hard_arrow.yaml
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.RandomResizedCrop
          size: 224
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
          p: 0.5
        - _target_: caidbench.data.transforms.ColorJitter
          brightness: 0.24705882352941178
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      trsf:
        - _target_: caidbench.data.transforms.Resize
          size: 256
        - _target_: caidbench.data.transforms.CenterCrop
          size: 224
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

train:
  epochs: 1
  batch_size: 32
  num_workers: 4
  log_interval: 50
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4

method:
  name: finetune
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 512
