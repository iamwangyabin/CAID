# Directly consume an AID-processed Arrow/HF dataset directory.
# Expected AID layout:
#   data_root/
#     data-*.arrow, dataset_info.json, state.json
#     mapping.json
#     train.json / val.json / test.json / optional train_binary.json ...
# CAIDBench does not require caid_meta.jsonl for this mode; protocol YAML can
# select existing AID subsets with `subset: <name>`.
seed: 0
device: cuda
output_dir: outputs/aid_arrow_run

scenario:
  data:
    backend: aid_arrow
    path: /path/to/AID/processed_arrow_dataset
    image_column: image
  protocol: protocols/examples/aid_subset_incremental.yaml
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 224
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

train:
  epochs: 1
  batch_size: 32
  num_workers: 4
  optimizer:
    type: adamw
    lr: 1.0e-4

method:
  name: finetune
  num_classes: 2
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 128
