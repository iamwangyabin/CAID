seed: 0
device: auto
output_dir: outputs/arrow_run
scenario:
  data:
    backend: aid_arrow
    # AID-style dataset directory produced by caid-pack-dataset.
    # The Arrow/HF payload has one column: image. Metadata is read from
    # mapping.json plus train/val/test JSON sidecars in the same directory.
    path: data/arrow/dataset
    image_column: image
    path_column: null
    root_dir: null
  protocol: protocols/examples/toy_incremental.yaml
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 224
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
train:
  epochs: 1
  batch_size: 32
  num_workers: 4
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4
method:
  name: finetune
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 512
