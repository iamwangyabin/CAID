seed: 0
device: auto
output_dir: outputs/image_run
scenario:
  data:
    backend: manifest
    path: data/manifest.csv
    root: null
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 224
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
train:
  epochs: 1
  batch_size: 32
  num_workers: 4
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4
method:
  num_classes: 2
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 512
