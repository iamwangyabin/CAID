_base_: _base.yaml
method:
  name: ca_adapter_cail
  adapter_bottleneck: 32
  shuffle_grid: 4
  shuffle_weight: 0.5
  align_weight: 0.1
  kd_weight: 1.0
  structure_kd_weight: 0.5
  temperature: 2.0
  memory_size: 1000
  memory_batch_size: 32
  freeze_base: true
train:
  optimizer:
    type: adamw
    lr: 0.002
    weight_decay: 0.0002
