seed: 0
device: auto
output_dir: outputs/caidbench/finetune

logging:
  backend: swanlab
  project: CAIDBench
  mode: cloud

scenario:
  data:
    backend: caidbench
    path: /home/home/yabin/CAIDBench
    image_column: image
    label_column: label
    generator_column: generator_name
    dataset_column: source_dataset
    source_path_column: source_path
    split_column: split
    task_hint_mode: dir
    domain_from: dir_name
  protocol: protocols/caidbench/default_protocol.yaml
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.RandomResizedCrop
          size: 224
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
          p: 0.5
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      trsf:
        - _target_: caidbench.data.transforms.Resize
          size: 256
        - _target_: caidbench.data.transforms.CenterCrop
          size: 224
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

train:
  epochs: 1
  batch_size: 32
  num_workers: 4
  log_interval: 50
  optimizer:
    type: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4

method:
  name: finetune
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 512
