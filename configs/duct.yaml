_base_: _base.yaml
seed: 1993
output_dir: outputs/duct_cddb_hard
train:
  epochs: 15
  batch_size: 128
  num_workers: 16
  optimizer:
    type: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
method:
  name: duct
  implementation: expanded_head
  num_classes: 2
  detector_cfg:
    num_classes: 2
    backbone:
      type: timm
      name: vit_base_patch16_224
      pretrained: true
      pretrained_cfg_overlay:
        url: https://storage.googleapis.com/vit_models/augreg/B_16-i21k-300ep-lr_0.001-aug_medium1-wd_0.1-do_0.0-sd_0.0--imagenet2012-steps_20k-lr_0.01-res_224.npz
      out_dim: null
  merge_scalar: 0.5
  head_merge_ratio: 0.5
  increment: 2
  total_sessions: 5
  epc_re: 5
  retrain_epochs: 5
  lr_re: 0.001
  use_official_retrain_lr: true
  bcb_lr_scale: 0.01
  ot_reg: 0.1
  reset_backbone_each_task: true
  lrate: 0.1
  milestones: [60, 100, 140]
  lrate_decay: 0.1
  weight_decay: 0.0005
