_base_: _base_arrow.yaml
seed: 1234
output_dir: outputs/hdp_efficientnet_b4
scenario:
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 224
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
train:
  epochs: 20
  batch_size: 64
  num_workers: 4
  lr_scheduler: step
  step_size: 10
  gamma: 0.1
  optimizer:
    type: adam
    lr: 0.0002
    weight_decay: 0.00001
method:
  name: hdp
  num_classes: 2
  epsilon: 0.15
  uap_shape: [3, 224, 224]
  uap_alpha: 0.0001
  uap_iters: 5
  uap_success_threshold: 0.8
  uap_max_steps_per_batch: 100
  feature_kd_weight: 1.0
  logit_kd_weight: 1.0
  real_kd_weight: 1.0
  adv_kd_weight: 1.0
  clamp_inputs: true
  clamp_min: -1.0
  clamp_max: 1.0
  detector_cfg:
    num_classes: 2
    backbone:
      type: timm
      name: tf_efficientnet_b4_ns
      pretrained: true
      out_dim: 128
      drop_rate: 0.2
