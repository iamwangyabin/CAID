_base_: _base_image.yaml
output_dir: outputs/hsic_online_clip
scenario:
  data:
    backend: manifest
    path: data/manifest.csv
    root: null
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 224
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.48145466, 0.4578275, 0.40821073]
        std: [0.26862954, 0.26130258, 0.27577711]
method:
  name: hsic_bottleneck
  hsic_weight: 1.0
  label_hsic_weight: 0.0
  memory_size: 1500
  memory_batch_size: 32
  kd_weight: 0.5
  detector_cfg:
    backbone:
      type: clip_vision
      backend: open_clip
      model_name: ViT-L-14
      pretrained: openai
      freeze: true
      out_dim: 768
      normalize: true
