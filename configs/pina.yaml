_base_: _base.yaml
seed: 1993
output_dir: outputs/pina_cddb_hard
train:
  epochs: 50
  batch_size: 128
  num_workers: 16
  optimizer:
    type: sgd
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0002
method:
  name: pina_d
  num_classes: 2
  detector_cfg:
    num_classes: 2
    backbone:
      type: timm
      name: vit_base_patch16_224
      pretrained: true
  dataset: cddb
  init_cls: 2
  increment: 2
  total_sessions: 5
  task_name: [gaugan, biggan, wild, whichfaceisreal, san]
  multiclass: [false, false, false, false, false]
  image_dim: 768
  prompt_length: 10
  ca_mode: deep
  hidden_dim: 16
  num_centers: 5
  train_unified_on_first_task: true
  init_epoch: 50
  init_lr: 0.001
  init_lr_decay: 0.1
  init_weight_decay: 0.0002
  epochs: 50
  lr: 0.001
  lr_decay: 0.1
  weight_decay: 0.0002
  memory_size: 0
  fixed_memory: true
  shuffle: false
