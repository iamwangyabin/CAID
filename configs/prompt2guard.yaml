_base_: _base_image.yaml
output_dir: outputs/prompt2guard
scenario:
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.RandomResizedCrop
          size: 224
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
        - _target_: caidbench.data.transforms.ColorJitter
          brightness: 0.24705882352941178
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      trsf:
        - _target_: caidbench.data.transforms.Resize
          size: 256
          interpolation: bicubic
        - _target_: caidbench.data.transforms.CenterCrop
          size: 224
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
train:
  epochs: 20
  batch_size: 2
  optimizer:
    type: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0002
method:
  name: prompt2guard
  model_name: ViT-B-16
  pretrained: openai
  K: 7
  topk_classes: 5
  ensembling: [false, false, true, false]
  prototype: fake
  prediction_mode: mix_top_mean
  n_clusters: 5
  label_smoothing: 0.1
  # Optional official Prompt2Guard sidecar. When set, object labels are loaded
  # from classes.pkl by matching batch["path"] against this mapping.
  object_label_sidecar: null
  object_label_root: null
  init_lr: 0.01
  lrate: 0.01
  init_weight_decay: 0.0005
  weight_decay: 0.0002
  warmup_epoch: 1
  warmup_lr: 1.0e-5
