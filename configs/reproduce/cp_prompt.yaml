_base_: ../_base.yaml
seed: 1993
output_dir: outputs/cp_prompt_cddb_hard
train:
  epochs: 50
  batch_size: 128
  num_workers: 16
  optimizer:
    type: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
method:
  name: cp_prompt
  implementation: official
  num_classes: 2
  detector_cfg:
    num_classes: 2
    backbone:
      type: clip_vision
      model_name: ViT-B-16
      pretrained: openai
      freeze: true
  dataset: cddb
  init_cls: 2
  increment: 2
  total_sessions: 5
  task_name: [gaugan, biggan, wild, whichfaceisreal, san]
  knn_k: 5
  query_type: vit_query
  embd_dim: 768
  prefix_tuning: keqv
  is_fix_share_prompt: true
  share_prompt_length: 6
  prefix_prompt_length: 10
  prefix_prompt_layers: [3, 5, 6, 7, 8]
  hidden_dim: 64
  num_centers: 5
  common_prompt_lr_scale: 1.0
  is_fix_share_prompt: true
  init_epoch: 50
  init_lr: 0.01
  init_milestones: [20, 30, 40]
  init_lr_decay: 0.1
  init_weight_decay: 0.0005
  epochs: 50
  lrate: 0.01
  milestones: [20, 30]
  lrate_decay: 0.1
  weight_decay: 0.0002
