_base_: ../_base.yaml
output_dir: outputs/hsic_debug
scenario:
  transform:
    trsf:
      - _target_: caidbench.data.transforms.SquareResize
        size: 64
      - _target_: caidbench.data.transforms.ToTensor
      - _target_: caidbench.data.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
train:
  epochs: 1
  batch_size: 8
  num_workers: 0
method:
  name: hsic_bottleneck
  hsic_weight: 0.2
  label_hsic_weight: 0.0
  memory_size: 64
  memory_batch_size: 8
  kd_weight: 0.2
  detector_cfg:
    backbone:
      type: small_conv
      out_dim: 128
