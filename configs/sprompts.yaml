_base_: _base_arrow.yaml
output_dir: outputs/sprompts_official
scenario:
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.RandomResizedCrop
          size: 224
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
          p: 0.5
        - _target_: caidbench.data.transforms.ColorJitter
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      trsf:
        - _target_: caidbench.data.transforms.Resize
          size: 256
        - _target_: caidbench.data.transforms.CenterCrop
          size: 224
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
method:
  name: sprompts
  implementation: official
  net_type: slip
  prompt_length: 10
  num_centers: 5
  class_names: [real, fake]
  n_ctx: 16
  backbone:
    type: open_clip
    model_name: ViT-B-16
    pretrained: openai
  train_backbone: false
  normalize_features: true
  use_official_schedule: true
  init_epoch: 20
  epochs: 20
  init_lr: 0.01
  lrate: 0.01
  init_weight_decay: 0.0005
  weight_decay: 0.0002
train:
  optimizer:
    type: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 2.0e-4
