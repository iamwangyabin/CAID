# S-Prompts on CDDB AID-style Arrow.
#
# First run downloads the CDDB Arrow mirror to data/datasets/CDDB.arrow and may
# download OpenCLIP ViT-B/16 weights if they are not already cached.
#
# Run:
#   python3 -m caidbench.cli.train --config configs/sprompts_cddb_arrow_remote.yaml
#
# Full official-style schedule:
#   python3 -m caidbench.cli.train --config configs/sprompts_cddb_arrow_remote.yaml \
#     --override method.use_official_schedule=true method.init_epoch=20 method.epochs=20 logging.backend=swanlab

seed: 0
device: auto
output_dir: outputs/sprompts_cddb_arrow

logging:
  backend: none

scenario:
  data:
    backend: aid_arrow
    image_column: image
    remote:
      platform: modelscope
      repo_ids:
        huggingface: nebula/CDDB.arrow
        modelscope: yabinnng/CDDB.arrow
      local_dir: data/datasets/CDDB.arrow
      path_in_repo: .
      max_workers: 16
  protocol: protocols/examples/cddb_arrow_subsets.yaml
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.RandomResizedCrop
          size: 224
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
          p: 0.5
        - _target_: caidbench.data.transforms.ColorJitter
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      trsf:
        - _target_: caidbench.data.transforms.Resize
          size: 256
        - _target_: caidbench.data.transforms.CenterCrop
          size: 224
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

train:
  epochs: 1
  batch_size: 16
  num_workers: 4
  optimizer:
    type: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 2.0e-4

method:
  name: sprompts
  implementation: official
  net_type: slip
  prompt_length: 10
  num_centers: 5
  class_names: [real, fake]
  n_ctx: 16
  backbone:
    type: open_clip
    model_name: ViT-B-16
    pretrained: openai
  train_backbone: false
  normalize_features: true
  use_official_schedule: false
  init_epoch: 20
  epochs: 20
  init_lr: 0.01
  lrate: 0.01
  init_weight_decay: 0.0005
  weight_decay: 0.0002
