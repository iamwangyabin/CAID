_base_: _base.yaml
seed: 512
output_dir: outputs/sur_lid_official

scenario:
  transform:
    train:
      trsf:
        - _target_: caidbench.data.transforms.SquareResize
          size: 256
        - _target_: caidbench.data.transforms.RandomHorizontalFlip
          p: 0.5
        - _target_: caidbench.data.transforms.DataAugment
          blur_prob: 0.5
          blur_sig: [3, 7]
          jpg_prob: 0.5
          jpg_method: [pil]
          jpg_qual: [40, 100]
        - _target_: caidbench.data.transforms.ColorJitter
          brightness: [0.9, 1.1]
          contrast: [0.9, 1.1]
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.5, 0.5, 0.5]
          std: [0.5, 0.5, 0.5]
    test:
      trsf:
        - _target_: caidbench.data.transforms.SquareResize
          size: 256
        - _target_: caidbench.data.transforms.ToTensor
        - _target_: caidbench.data.transforms.Normalize
          mean: [0.5, 0.5, 0.5]
          std: [0.5, 0.5, 0.5]

train:
  epochs: 10
  batch_size: 32
  num_workers: 8
  lr_scheduler: step
  lr_step: 10
  lr_gamma: 0.4
  optimizer:
    type: adam
    lr: 2.0e-4
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 5.0e-4
    amsgrad: false

method:
  name: sur_lid
  num_classes: 2
  max_tasks: 4
  detector_cfg:
    backbone:
      type: timm
      name: efficientnet_b4
      pretrained: false
      pretrained_path: ./training/pretrained/efficientnet-b4-6ed6700e.pth
  alpha: 0.1
  num_pic: 504
  align_epoch: 1
  mem_each_batch: 3
  supcon_weight: 4.0
  fd_weight: 10.0
  kd_weight: 1.0
  center_move_avg: true
  replay_mode: sparse_robust
  feat_aug: true
  feat_aug_v: random
  require_official_feature_dim: true
  official_feature_dim: 1792
  require_backbone_checkpoint: true
  train_shuf_p: 0.0
  protocol: P1
  sup_task_weight: 0.0
  frozen: semi
  grid_size: 128
  classifier_ensemble: mean
