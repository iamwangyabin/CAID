  - {id: progan, name: ProGAN, numeric_id: 2, filter: {include: {generator: ProGAN}}}
  - {id: biggan, name: BigGAN, numeric_id: 3, filter: {include: {generator: BigGAN}}}
  - {id: wukong, name: Wukong, numeric_id: 4, filter: {include: {generator: Wukong}}}
  - {id: sd15, name: SD1.5, numeric_id: 5, filter: {include: {generator: [SD1.5, StableDiffusion1.5]}}}
  - {id: vqdm, name: VQDM, numeric_id: 6, filter: {include: {generator: VQDM}}}
  - {id: midjourney_v5, name: Midjourney-V5, numeric_id: 7, filter: {include: {generator: Midjourney-V5}}}
