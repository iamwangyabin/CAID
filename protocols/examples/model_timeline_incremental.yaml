name: model_timeline_incremental
# Chronological incremental protocol derived from the pasted model/source draft.
# Filtering convention:
#   - dataset: source package name, e.g. CNNDetection, GenImage, OpenFake.
#   - task_hint: canonical model task id below.
# Extra keys such as release, train_sources, and task_group are kept for audit.
tasks:
