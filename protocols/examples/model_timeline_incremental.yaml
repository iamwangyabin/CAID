    name: ProGAN
    numeric_id: 0
    release: "2017-10"
    task_group: image_gan
    train_sources: [CNNDetection]
    test_sources: [CNNDetection]
    filter: {include: {dataset: [CNNDetection], task_hint: progan}}
    test: {split: test, include: {dataset: [CNNDetection], task_hint: progan}}
