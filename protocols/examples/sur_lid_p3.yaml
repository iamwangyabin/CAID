name: sur_lid_p3_official
# Official paper P3 order: FF++ -> DFDCP -> DFD -> CDF.
# Expected metadata columns: dataset, label, split, video_id, manipulation.
tasks:
  - id: ffpp
    name: FF++
    numeric_id: 0
    filter:
      include:
        dataset: [FF++, FaceForensics++]
  - id: dfdcp
    name: DFDCP
    numeric_id: 1
    filter:
      include:
        dataset: [DFDCP]
  - id: dfd
    name: DFD
    numeric_id: 2
    filter:
      include:
        dataset: [DFD, DeepFakeDetection]
  - id: cdf
    name: Celeb-DF
    numeric_id: 3
    filter:
      include:
        dataset: [Celeb-DF, Celeb-DF-v2, CDF]
